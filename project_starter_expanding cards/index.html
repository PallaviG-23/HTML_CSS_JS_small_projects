<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Expanding Cards</title>
</head>

<body>
    <div class="container">
        <div class="panel active" style="background-image: url('images/explore_the_world.jpg');">
            <h3 style="margin-left: 120px;">Explore The World</h3>
        </div>
        <div class="panel" style="background-image: url('images/forest.jpg');">
            <h3>Forest</h3>
        </div>
        <div class="panel" style="background-image: url('images/sunny_beach.jpg');">
            <h3>Sunny Beach</h3>
        </div>
        <div class="panel" style="background-image: url('images/snowy_mountain.jpg');">
            <h3>Snowy Mountain</h3>
        </div>
        <div class="panel" style="background-image: url('images/mountain_cloud.jpg');">
            <h3>Mountains On Cloud</h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
